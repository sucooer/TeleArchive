services:
  telearchive:
    build: .
    container_name: telearchive
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BOT_API_BASE_URL: http://telegram-bot-api:8081/bot
      BOT_API_BASE_FILE_URL: http://telegram-bot-api:8081/file/bot
      BOT_API_LOCAL_MODE: "1"
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
      - ./logs:/app/logs
      - /media/tg:/media/tg
      - type: volume
        source: telegram-bot-api-data
        target: /var/lib/telegram-bot-api
        read_only: true
    depends_on:
      - telegram-bot-api
    networks:
      - telearchive-network

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
      TELEGRAM_HTTP_PORT: "8081"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    networks:
      - telearchive-network

volumes:
  telegram-bot-api-data:

networks:
  telearchive-network:
    driver: bridge
