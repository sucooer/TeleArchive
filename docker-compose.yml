version: '3.8'

services:
  telearchive:
    build: .
    container_name: telearchive
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - telegram-bot-api
    networks:
      - telearchive-network

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    command: --local --http-port=8081
    networks:
      - telearchive-network

volumes:
  telegram-bot-api-data:

networks:
  telearchive-network:
    driver: bridge
